# Agent Board - Docker Stack

services:
  # ===== PERSISTENCE =====

  agent-db:
    image: postgres:16-alpine
    container_name: agent-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=agent_board
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent
    ports:
      - "5432:5432"
    volumes:
      - agent_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_board"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ===== LLM SERVICES =====

  # Local Ollama instance — runs models pulled via `docker exec ollama ollama pull <model>`
  # Default model: llama3.2:3b (small + modern — 7B-class models like llama2 are too
  # slow on CPU-only hosts and blow past the dashboard's 120s chat timeout).
  # Port: 8081 (host) → 8080 (container)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_HOST=0.0.0.0:8080
      # Default keep_alive (5m) unloads the model between requests; on CPU-only
      # hosts reloading a 7B model from disk can exceed the dashboard's chat
      # timeout. Keep it resident for 30m of inactivity instead.
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agent-network

  # Opt-in: pre-loads PRIMARY_LLM_MODEL into the running `ollama` service right
  # after the stack starts, so the ~15-25s cold model load (see
  # docs/MODEL_LOADING_AUDIT.md) happens during `docker compose up` instead of on
  # a user's first chat message. Purely additive — does not modify or restart the
  # `ollama` service. Enable with:
  #   docker compose --profile warmup up ollama-warmup
  ollama-warmup:
    image: ollama/ollama:latest
    container_name: ollama-warmup
    profiles:
      - warmup
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.2:3b}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          ollama list >/dev/null 2>&1 && break
          sleep 2
        done
        ollama run "$$PRIMARY_LLM_MODEL" "" || true
    restart: "no"
    networks:
      - agent-network

  # Docker Model Runner (docker.io/ai/* models) — NOT a container.
  # This is Docker Desktop's built-in model runner feature.
  # Pull models on the host with:  docker model pull ai/glm-4.7-flash:latest
  #                                 docker model pull ai/qwen3-coder:latest
  # Endpoint (from inside containers): http://model-runner.docker.internal/engines/llama.cpp/v1
  # API style: OpenAI-compatible (/v1/chat/completions, /v1/models)
  # No container needed — Docker Desktop exposes this automatically.

  # OpenLLM (BentoML) — second OpenAI-compatible endpoint, for custom or
  # fine-tuned HuggingFace models that don't fit Ollama's Modelfile pattern.
  # Opt-in: set OPENLLM_MODEL and enable the `openllm` profile.
  # Enable with: OPENLLM_ENABLED=true OPENLLM_MODEL=<hf-repo-id> docker compose --profile openllm up -d llm_openllm
  # Port: 8082 (host) → 3000 (container)
  llm_openllm:
    build:
      context: ../tools/llm-openllm
      dockerfile: Dockerfile
    container_name: llm_openllm
    restart: unless-stopped
    profiles:
      - openllm
    ports:
      - "8082:3000"
    environment:
      - OPENLLM_MODEL=${OPENLLM_MODEL:-}
      - PORT=3000
    volumes:
      - openllm_data:/root/.cache
    networks:
      - agent-network

  # ===== SAFETY & SANDBOX =====
  # Opt-in: enable with --profile sandbox
  # NemoClaw is currently deferred (crash-loops on Windows builds — CRLF in entrypoint).
  # Gate it behind a profile so it never starts in the default stack.
  nemoclaw:
    image: nemoclaw:latest
    container_name: nemoclaw
    profiles:
      - sandbox
    ports:
      - "9000:8080"
    command: |
      sh -lc 'node -e "const net=require("net");net.createServer((socket)=>{const upstream=net.connect(18789,"127.0.0.1");socket.pipe(upstream);upstream.pipe(socket);const close=()=>{if(!socket.destroyed) socket.destroy(); if(!upstream.destroyed) upstream.destroy();};socket.on("error",close);upstream.on("error",close);socket.on("close",close);upstream.on("close",close);}).listen(8080,"0.0.0.0");" & exec /usr/local/bin/nemoclaw-wrapper.sh'
    volumes:
      - nemoclaw_data:/workspace
      - /tmp
    environment:
      - NEMOCLAW_HOME=/workspace
      - LLM_API_URL=http://ollama:8080
      - OPENSHELL_ENABLE=true
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # healthcheck disabled because wget/curl is unavailable in this container
    depends_on:
      ollama:
        condition: service_started
    networks:
      - agent-network

  # ===== MCP SERVERS =====

  bb-mcp:
    build:
      context: ../bb-mcp
      dockerfile: Dockerfile
    container_name: bb-mcp
    restart: unless-stopped
    profiles:
      - bb-mcp
    ports:
      - "3100:3100"
    env_file:
      - ../bb-mcp/.env
    environment:
      - PORT=3100
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - agent-network

  # ===== WEB DASHBOARD =====
  
  agent-dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        GITHUB_ID: ${GITHUB_ID}
        GITHUB_SECRET: ${GITHUB_SECRET}
    container_name: agent-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - PRIMARY_LLM_URL=http://ollama:8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.2:3b}
      # Docker Model Runner: Docker Desktop exposes this host to all containers
      - DOCKER_RUNNER_URL=http://model-runner.docker.internal/engines/llama.cpp/v1
      - DOCKER_RUNNER_MODEL=ai/qwen3-coder:latest
      - GLM_FLASH_MODEL=ai/glm-4.7-flash:latest
      - OPENLLM_URL=http://llm_openllm:3000
      - OPENLLM_MODEL=${OPENLLM_MODEL:-}
      - OPENLLM_ENABLED=${OPENLLM_ENABLED:-false}
      - NEMOCLAW_URL=http://nemoclaw:8080
      - BB_MCP_URL=http://bb-mcp:3100
      - BB_MCP_ENABLED=${BB_MCP_ENABLED:-false}
      # MCP tool servers backing the Content Studio / Website Agent experiences
      # (profile `tools` — see tool-content-gen / tool-website below)
      - TOOL_CONTENT_GEN_URL=http://tool-content-gen:3200
      - TOOL_WEBSITE_URL=http://tool-website:3201
      - AGENT_BOARD_ENABLE_DOCKER_CONTROL=${AGENT_BOARD_ENABLE_DOCKER_CONTROL:-false}
      - PORT=3000
      - DATABASE_URL=postgresql://agent:[REDACTED]@agent-db:5432/agent_board
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ../:/workspace-root:ro
    # Docker socket access is intentionally not mounted by default.
    # Add it only in a trusted dev override/profile when Docker control is explicitly needed.
    # healthcheck is disabled until a stable in-container HTTP client is available
    # depends_on:

    #   llm_qwen3:
    #     condition: service_healthy
    #   llm_qwen_coder:
    #     condition: service_healthy
    #   llm_glm_flash:
    #     condition: service_healthy
    depends_on:
      agent-db:
        condition: service_healthy
    networks:
      - agent-network

  # ===== OBSERVABILITY =====

  # Jaeger all-in-one — accepts OTLP and provides a trace UI.
  # View traces at http://localhost:16686
  # OTLP/HTTP endpoint (used by agent-dashboard): http://jaeger:4318
  # Opt-in: enable with --profile observability  (also set OTEL_ENABLED=true)
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP/HTTP ingest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ===== TOOL: CONTENT-GEN (profile: tools) =====
  # AI video generation MCP server wrapping MoneyPrinterTurbo.
  # MoneyPrinterTurbo itself runs on the HOST (not in this stack) because
  # it manages its own Docker containers. This service just wraps its API.
  # Enable with:  docker compose --profile tools up tool-content-gen
  tool-content-gen:
    build:
      # Relative to the project directory (compose is run with --project-directory .)
      context: ../tools/content-gen
      dockerfile: Dockerfile
    container_name: tool-content-gen
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "3200:3200"
    env_file:
      - .env
    environment:
      - CONTENT_GEN_PORT=3200
      - MPT_API_URL=${MPT_API_URL:-http://host.docker.internal:8080}
      - MPT_UI_URL=${MPT_UI_URL:-http://host.docker.internal:8501}
      - MONEYPRINTERTURBO_COMPOSE=${MONEYPRINTERTURBO_COMPOSE:-/workspace-root/content-gen/MoneyPrinterTurbo/docker-compose.yml}
    volumes:
      - ../:/workspace-root:ro
      # Mount Docker socket so the server can start/stop MoneyPrinterTurbo
      # Only enabled when AGENT_BOARD_ENABLE_DOCKER_CONTROL=true
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3200/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agent-network

  # ===== TOOL: WEBSITE (profile: tools) =====
  # B2B website generation MCP server. Runs website gen scripts on the host
  # via PowerShell (mounted from workspace-root).
  # Enable with:  docker compose --profile tools up tool-website
  tool-website:
    build:
      # Relative to the project directory (compose is run with --project-directory .)
      context: ../tools/website
      dockerfile: Dockerfile
    container_name: tool-website
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "3201:3201"
    env_file:
      - .env
    environment:
      - WEBSITE_PORT=3201
      - WEBSITE_OUTPUT_DIR=/output
      - YELP_API_KEY=${YELP_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - YOUR_NAME=${YOUR_NAME:-}
      - YOUR_COMPANY=${YOUR_COMPANY:-Your Web Agency}
      - YOUR_EMAIL=${YOUR_EMAIL:-}
      - YOUR_PHONE=${YOUR_PHONE:-}
      # Netlify auth token — avoids interactive `netlify login` inside the container.
      # Get yours at: https://app.netlify.com/user/applications#personal-access-tokens
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:-}
    volumes:
      # /app/output matches $PSScriptRoot/../output inside the container scripts
      - website_output:/app/output
      # Relative to the project directory (compose is run with --project-directory .)
      - ./tools/website/templates:/app/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3201/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agent-network

  # ===== TEST (unit — no stack required) =====
  test:
    build:
      context: ../dashboard
      target: test
    profiles:
      - test
    environment:
      - AGENT_DASHBOARD_DISABLE_LISTEN=1

volumes:
  agent_db_data:
  ollama_data:  # Local Ollama model storage (llama2, etc.)
  openllm_data:  # OpenLLM/HuggingFace + BentoML model cache
  nemoclaw_data:
  website_output:  # Persistent storage for generated client sites and pitch materials

networks:
  agent-network:
    name: agent-network
    driver: bridge
    external: false


