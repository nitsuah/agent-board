# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm (root workspace)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'nitsuah'
    assignees:
      - 'nitsuah'
    labels:
      - 'dependencies'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'

  # Enable version updates for npm (dashboard)
  - package-ecosystem: 'npm'
    directory: '/dashboard'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'nitsuah'
    assignees:
      - 'nitsuah'
    labels:
      - 'dependencies'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'

  # Enable version updates for Docker (dashboard)
  - package-ecosystem: 'docker'
    directory: '/dashboard'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'nitsuah'
    labels:
      - 'dependencies'
      - 'docker'
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: 'chore(docker)'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'nitsuah'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'