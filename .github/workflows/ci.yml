# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main, feedback-dev-*, feat/* ]
  pull_request:
    branches: [ main, feat/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --config config/.pre-commit-config.yaml
      - name: Docker Compose Build
        run: docker compose -f config/docker-compose.yml build
      - name: Docker Compose Up
        run: docker compose -f config/docker-compose.yml up -d
      - name: Check Docker Compose Services
        run: docker compose -f config/docker-compose.yml ps
